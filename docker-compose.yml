x-airflow-common: &airflow-common
  build: ./airflow
  image: fraud-platform-airflow:latest
  # Spark chmods the files it writes under ./data. Files that came from the host (git checkout)
  # are not owned by the image's default uid 50000, so that fails. Root works on every OS;
  # on Linux, set AIRFLOW_UID=$(id -u) to keep the outputs owned by your user.
  user: "${AIRFLOW_UID:-0}:0"
  environment: &airflow-env
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    # Used by Member 1's ingestion script (reaches the broker on the Docker network)
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    # Used by Member 5's load step (scripts/load_predictions_to_postgres.py)
    FRAUD_DB_URL: postgresql://airflow:airflow@postgres:5432/fraud
    PYTHONPATH: /opt/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
    - ./models:/opt/airflow/models
    - ./dataset:/opt/airflow/dataset
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-platform-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fraud-platform-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Member 5: REST API over fraud predictions (http://localhost:8000/docs)
  api:
    build: ./api
    image: fraud-platform-api:latest
    container_name: fraud-platform-api
    environment:
      FRAUD_DB_URL: postgresql://airflow:airflow@postgres:5432/fraud
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: create the Airflow metadata tables and the admin user, then exit
  airflow-init:
    <<: *airflow-common
    container_name: fraud-platform-airflow-init
    restart: "no"
    command: >
      bash -c "airflow db init &&
               (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@frauddetection.com || true)"

  airflow-webserver:
    <<: *airflow-common
    container_name: fraud-platform-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud-platform-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
